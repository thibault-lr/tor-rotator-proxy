name: Docker

on:
  pull_request:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Validate Compose files
        env:
          TOR_ROTATOR_IMAGE: tor-rotator-proxy
          TOR_ROTATOR_VERSION: check
        run: |
          docker compose config --quiet
          docker compose -f compose.images.yaml config --quiet
      - name: Check both architectures
        run: docker buildx build --platform linux/amd64,linux/arm64 --target check .
      - name: Build production images
        run: |
          docker buildx build --platform linux/amd64,linux/arm64 .
          docker buildx build --platform linux/amd64,linux/arm64 --file deploy/tor.Dockerfile .

  publish:
    if: github.event_name == 'release'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish versioned images
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
        run: |
          image="${DOCKERHUB_USERNAME}/tor-rotator-proxy"
          version="${RELEASE_TAG#v}"
          docker buildx build --platform linux/amd64,linux/arm64 \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.version=${version}" \
            --tag "${image}:${version}" --push .
          docker buildx build --platform linux/amd64,linux/arm64 \
            --file deploy/tor.Dockerfile \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.version=${version}" \
            --tag "${image}-tor:${version}" --push .
